<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank – Count of Patches</title>
  <meta name="description" content="Vielen Dank für deine Anfrage oder Bestellung bei Count of Patches.">
  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#f4f7fc;
      color:#172033;
    }
    .wrap{
      max-width:760px;
      margin:80px auto;
      padding:0 20px;
    }
    .card{
      background:#fff;
      border:1px solid #dbe4f2;
      border-radius:18px;
      padding:36px 28px;
      box-shadow:0 12px 28px rgba(0,0,0,0.08);
      text-align:center;
    }
    h1{
      margin:0 0 16px;
      color:#0039A6;
      font-size:36px;
    }
    p{
      font-size:18px;
      line-height:1.6;
      margin:0 0 14px;
    }
    a.btn{
      display:inline-block;
      margin-top:18px;
      padding:12px 18px;
      border-radius:12px;
      background:#0039A6;
      color:#fff;
      text-decoration:none;
      font-weight:700;
    }
    a.btn:hover{
      background:#002c80;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Vielen Dank!</h1>
      <p>Deine Anfrage bzw. Bestellung wurde erfolgreich übermittelt.</p>
      <p>Ich melde mich schnellstmöglich per E-Mail bei dir zurück.</p>
      <a class="btn" href="/index.html">Zurück zur Startseite</a>
    </div>
  </div>
</body>
</html>
