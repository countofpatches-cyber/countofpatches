<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank – Count of Patches</title>
  <style>
    :root{--blue:#0039a6;--blue-dark:#002d7a;--light:#f3f6fb;--card:#fff;--text:#1a2238;--muted:#667089;--line:#d9e2f0;--shadow:0 12px 28px rgba(0,0,0,.08);--radius:18px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--text);line-height:1.6}
    a{color:var(--blue);text-decoration:none}
    .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{width:64px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:14px;padding:4px}
    .brand h1{margin:0;color:var(--blue-dark);font-size:22px}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
    nav{display:flex;gap:16px;flex-wrap:wrap}nav a{font-weight:700;color:var(--text)}
    main{padding:60px 0}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px;text-align:center}
    h2{font-size:42px;color:var(--blue-dark);margin:0 0 14px}
    p{font-size:18px;color:var(--muted)}
    .btn{display:inline-block;background:var(--blue);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;margin-top:14px}
    footer{padding:28px 0;background:#fff;border-top:1px solid var(--line)}
    @media(max-width:700px){h2{font-size:32px}.card{padding:22px}nav{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}}
  </style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <div class="brand">
      <img src="/logo.jpeg" alt="Count of Patches Logo">
      <div><h1>Count of Patches</h1><p>Faire Preise für die Blaulichtfamilie</p></div>
    </div>
    <nav>
      <a href="/index.html">Startseite</a>
      <a href="/galerie.html">Galerie</a>
      <a href="/index.html#anfrage">Preisanfrage</a>
      <a href="https://count-of-patches.com">Shop</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="card">
      <h2>Vielen Dank!</h2>
      <p>Deine Anfrage wurde erfolgreich übermittelt.</p>
      <p>Ich melde mich schnellstmöglich bei dir zurück.</p>
      <a class="btn" href="/index.html">Zurück zur Startseite</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a>
  </div>
</footer>
</body>
</html>
