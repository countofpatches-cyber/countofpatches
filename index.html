<form name="preisanfrage" method="POST" action="/danke.html" data-netlify="true" enctype="multipart/form-data" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="preisanfrage">
  <p hidden>
    <label>Bitte nicht ausfüllen: <input name="bot-field"></label>
  </p>

  <div class="grid two">
    <div>
      <label for="pa_vorname">Vorname</label>
      <input type="text" id="pa_vorname" name="vorname" required>
    </div>
    <div>
      <label for="pa_nachname">Nachname</label>
      <input type="text" id="pa_nachname" name="nachname" required>
    </div>
  </div>

  <div class="grid two">
    <div>
      <label for="pa_email">E-Mail-Adresse</label>
      <input type="email" id="pa_email" name="email" required>
    </div>
    <div>
      <label for="pa_dienststelle">Dienststelle / Ortsverband (optional)</label>
      <input type="text" id="pa_dienststelle" name="dienststelle">
    </div>
  </div>

  <div class="grid two">
    <div>
      <label for="pa_anschrift">Anschrift</label>
      <input type="text" id="pa_anschrift" name="anschrift" required>
    </div>
    <div>
      <label for="pa_plz">Postleitzahl</label>
      <input type="text" id="pa_plz" name="plz" required>
    </div>
  </div>

  <div class="grid two">
    <div>
      <label for="pa_wohnort">Wohnort</label>
      <input type="text" id="pa_wohnort" name="wohnort" required>
    </div>
    <div>
      <label for="pa_produkt">Produkt</label>
      <select id="pa_produkt" name="produkt" required>
        <option value="">Bitte auswählen</option>
        <option value="Patch / Ärmelabzeichen">Patch / Ärmelabzeichen (Mindestmenge 20)</option>
        <option value="Basecap">Basecap (keine Mindestmenge)</option>
        <option value="Schlüsselanhänger">Schlüsselanhänger (Mindestmenge 50)</option>
      </select>
    </div>
  </div>

  <div class="grid two">
    <div>
      <label for="pa_stueckzahl">Stückzahl</label>
      <input type="number" id="pa_stueckzahl" name="stueckzahl" min="1" required>
    </div>
    <div>
      <label for="pa_groesse">Größenwunsch</label>
      <input type="text" id="pa_groesse" name="groessenwunsch" placeholder="z. B. 8 cm breit">
    </div>
  </div>

  <div class="grid two">
    <div>
      <label for="pa_machart">Machart</label>
      <select id="pa_machart" name="machart" required>
        <option value="">Bitte auswählen</option>
        <option value="Gewebt">Gewebt</option>
        <option value="Gestickt">Gestickt</option>
        <option value="UV-Druck">UV-Druck</option>
        <option value="Rubber PVC 2D">Rubber PVC 2D</option>
        <option value="Rubber PVC 3D">Rubber PVC 3D</option>
      </select>
    </div>
    <div>
      <label for="pa_befestigung">Befestigung (optional)</label>
      <select id="pa_befestigung" name="befestigung">
        <option value="">Bitte auswählen</option>
        <option value="Klett">Klett</option>
        <option value="Zum Aufnähen">Zum Aufnähen</option>
        <option value="Andere / Unklar">Andere / Unklar</option>
      </select>
    </div>
  </div>

  <div class="grid two">
    <div>
      <label for="pa_schluesselanhaenger_typ">Motiv Schlüsselanhänger (optional)</label>
      <select id="pa_schluesselanhaenger_typ" name="schluesselanhaenger_typ">
        <option value="">Bitte auswählen</option>
        <option value="DRK">DRK</option>
        <option value="THW">THW</option>
        <option value="THW Jugend">THW Jugend</option>
        <option value="ASB">ASB</option>
        <option value="Malteser">Malteser</option>
        <option value="Feuerwehr schwarz">Feuerwehr schwarz</option>
        <option value="Feuerwehr gelb">Feuerwehr gelb</option>
        <option value="Feuerwehr rot">Feuerwehr rot</option>
        <option value="Polizei">Polizei</option>
        <option value="Individuelle Anfrage">Individuelle Anfrage</option>
      </select>
    </div>
    <div>
      <label for="pa_designlink">Design-Link (optional)</label>
      <input type="url" id="pa_designlink" name="design_link">
    </div>
  </div>

  <div>
    <label for="pa_datei">Datei hochladen (optional)</label>
    <input type="file" id="pa_datei" name="datei">
  </div>

  <div>
    <label for="pa_hinweise">Hinweise</label>
    <textarea id="pa_hinweise" name="hinweise" rows="5"></textarea>
  </div>

  <button type="submit">Preisanfrage absenden</button>
</form>
